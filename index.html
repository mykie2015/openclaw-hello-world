<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Hello World</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; touch-action: none; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: sans-serif;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 5px #000;
        }
    </style>
</head>
<body>
    <div id="info">Drag to rotate • Pinch to zoom<br>Double tap for more confetti!</div>
    
    <!-- Import Map for reliable Three.js loading -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let camera, scene, renderer, textMesh, controls;
        const emojis = ['😂', '🚀', '🎉', '🌎', '🍕', '🦄', '👾', '💩', '🎈', '🤠'];
        const particles = [];
        
        init();
        animate();

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.fog = new THREE.FogExp2(0x111111, 0.002);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
            camera.position.set(0, 0, 400);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 2.0;

            // Lights
            const dirLight = new THREE.DirectionalLight(0xffffff, 3);
            dirLight.position.set(0, 0, 1).normalize();
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xff00ff, 5, 500);
            pointLight.position.set(50, 50, 50);
            scene.add(pointLight);
            
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            // Text
            const loader = new FontLoader();
            loader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', function (font) {
                const geometry = new TextGeometry('HELLO\nWORLD', {
                    font: font,
                    size: 80,
                    height: 20,
                    curveSegments: 12,
                    bevelEnabled: true,
                    bevelThickness: 2,
                    bevelSize: 1,
                    bevelOffset: 0,
                    bevelSegments: 5
                });

                geometry.computeBoundingBox();
                const xOffset = -0.5 * (geometry.boundingBox.max.x - geometry.boundingBox.min.x);
                const yOffset = -0.5 * (geometry.boundingBox.max.y - geometry.boundingBox.min.y);
                geometry.translate(xOffset, yOffset, 0);

                const materials = [
                    new THREE.MeshPhongMaterial({ color: 0xffaa00, flatShading: true }), // front
                    new THREE.MeshPhongMaterial({ color: 0xff0000 }) // side
                ];

                textMesh = new THREE.Mesh(geometry, materials);
                scene.add(textMesh);
            });

            // Emoji Background
            for (let i = 0; i < 50; i++) {
                addEmoji(true);
            }

            // Events
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('dblclick', () => {
                for(let i=0; i<10; i++) addEmoji(false);
            });
            window.addEventListener('touchstart', (e) => {
                if(e.touches.length > 1) { // Double tap-ish
                    for(let i=0; i<5; i++) addEmoji(false);
                }
            });
        }

        function createEmojiTexture(emoji) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const context = canvas.getContext('2d');
            context.font = '80px serif';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillStyle = 'white';
            context.fillText(emoji, 64, 64);
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function addEmoji(randomPos) {
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            const material = new THREE.SpriteMaterial({ map: createEmojiTexture(emoji) });
            const sprite = new THREE.Sprite(material);
            
            if (randomPos) {
                sprite.position.x = Math.random() * 800 - 400;
                sprite.position.y = Math.random() * 800 - 400;
                sprite.position.z = Math.random() * 800 - 400;
            } else {
                sprite.position.set(0, 0, 0);
            }
            
            sprite.scale.set(30, 30, 1);
            
            // Custom velocity property
            sprite.userData.velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 5,
                (Math.random() - 0.5) * 5
            );

            scene.add(sprite);
            particles.push(sprite);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            // Animate emojis
            particles.forEach(p => {
                p.position.add(p.userData.velocity);
                p.rotation.z += 0.05; // 2D rotation of sprite
                
                // Bounce off "walls" (approximate)
                if(Math.abs(p.position.x) > 500) p.userData.velocity.x *= -1;
                if(Math.abs(p.position.y) > 500) p.userData.velocity.y *= -1;
                if(Math.abs(p.position.z) > 500) p.userData.velocity.z *= -1;
            });

            // Gentle hue shift for background
            const time = Date.now() * 0.0005;
            const hue = (Math.sin(time) + 1) * 0.1 + 0.5; // range 0.4 to 0.8 (bluish/purplish)
            scene.background.setHSL(hue, 0.5, 0.1);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
